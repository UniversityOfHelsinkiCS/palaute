# User manual videos, on top of docker-compose.ci.yml, see e2e/manual/README.md
services:
  app:
    environment:
      # Mail is a dry run outside production, this also points it nowhere
      - NODE_CONFIG={"PATE_URL":"http://127.0.0.1:9","JAMI_URL":"http://127.0.0.1:9"}

  tts:
    image: registry.version.helsinki.fi/toska/openshift/kontit/guide-video-voice:1.0.0
    profiles: [manual]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - 127.0.0.1:5005:5005
    container_name: palaute_manual_tts
