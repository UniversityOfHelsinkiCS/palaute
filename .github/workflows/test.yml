name: E2E Tests

on: [workflow_call]

jobs:
  lint:
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Build project for linting
        run: npm ci
      - name: Run oxlint with type checks
        run: npm run lint:quiet

  translations:
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Build project for translations
        run: npm ci
      - name: Analyse translations
        run: npm run translations -- --lang fi,en

  playwright:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      - name: Start the application
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: docker compose -f docker-compose.ci.yml up -d

      - name: Wait for the application
        run: timeout 180 bash -c 'until curl -sf http://localhost:8000/api/ping && curl -sf http://localhost:3003/ping; do sleep 2; done'

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          BASE_URL: http://localhost:8000

      - name: Check logs
        run: docker compose -f docker-compose.ci.yml logs
        if: failure()
