name: E2E Tests

on: [workflow_call]

jobs:
  lint:
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Build project for linting
        run: npm ci
      - name: Run oxlint with type checks
        run: npm run lint:quiet

  translations:
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Build project for translations
        run: npm ci
      - name: Analyse translations
        run: npm run translations -- --lang fi,en

  cypress:
    strategy:
      fail-fast: false
      matrix:
        spec:
          [
            common.spec.js,
            continuousFeedback.spec.js,
            courseSummary.spec.js,
            emailStatsView.spec.js,
            feedbackResults.spec.js,
            interimFeedback.spec.js,
            noad.spec.ts,
            organisationSurvey.spec.js,
            programme.spec.js,
            search.spec.ts,
            smallCourseFeedback.spec.ts,
            teacherview.spec.js,
            universitySurvey.spec.js,
            userfeedbacks.spec.js,
            versionedUniversitySurvey.spec.js,
            accessibility.spec.js,
          ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund

      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install cypress
        run: npx cypress install

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      # Jami is pulled from registry.version.helsinki.fi, which requires auth
      - name: Login to registry.version.helsinki.fi
        uses: docker/login-action@v4
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      - name: Start the application
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 5
          max_attempts: 3
          command: docker compose -f docker-compose.ci.yml up -d

      - name: Run cypress tests with retry
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 6
          max_attempts: 2
          command: ./node_modules/.bin/cypress run -C cypress.config.ci.js --headless --browser chrome --spec "cypress/integration/${{ matrix.spec }}"

      - name: Check logs
        run: docker compose -f docker-compose.ci.yml logs
        if: failure()
