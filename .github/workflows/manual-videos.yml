name: Manual videos

# Records the user manual videos, see e2e/manual/README.md
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      VERSION_PUSH_SECRET:
        required: true

permissions:
  contents: read

env:
  NARRATION_CACHE: registry.version.helsinki.fi/toska/openshift/kontit/norppa-manual-narration:latest
  MANUAL_VIDEOS: registry.version.helsinki.fi/toska/openshift/kontit/norppa-manual-videos

jobs:
  record:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/manual-videos-setup
        with:
          registry-password: ${{ secrets.VERSION_PUSH_SECRET }}

      - name: Find missing narration
        id: missing
        run: |
          touch "$MANUAL_MISSING_FILE"
          npx playwright test -c playwright.manual.config.ts --shard="$SHARD"
          echo "missing=$([ -s "$MANUAL_MISSING_FILE" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          MANUAL_PASS: narrate
          MANUAL_MISSING_FILE: ${{ runner.temp }}/missing.txt
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Start the voice service
        if: ${{ steps.missing.outputs.missing == 'true' }}
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          # Building the voice service downloads its weights
          timeout_minutes: 30
          max_attempts: 3
          command: docker compose -f docker-compose.ci.yml -f docker-compose.manual.yml --profile manual up -d tts

      - name: Wait for the voice service
        if: ${{ steps.missing.outputs.missing == 'true' }}
        run: timeout 900 bash -c 'until curl -sf http://localhost:5005/health; do sleep 5; done'

      - name: Record
        run: npm run manual:record -- --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

      # Also on failure and timeout, so the new clips are saved and a re-run continues from them
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: narration-${{ matrix.shard }}
          path: e2e/manual/.narration-cache
          include-hidden-files: true
          # A re-run shard uploads again
          overwrite: true
          if-no-files-found: ignore
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: video-${{ matrix.shard }}
          path: public/manual
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/manual
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

      - name: Check logs
        if: failure()
        run: docker compose -f docker-compose.ci.yml -f docker-compose.manual.yml --profile manual logs

  save-narration:
    needs: record
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      - uses: actions/download-artifact@v8
        with:
          pattern: narration-*
          path: shards

      # One at a time, shards that made the same clip would download it into the same file at once and break it
      - name: Merge the shards' clips
        run: |
          mkdir -p .narration-cache
          for shard in shards/*/; do cp -rn "$shard". .narration-cache/; done

      # Unused clips are dropped only when every shard of a first attempt passed on master. Releases, which are of older
      # commits, other branches and re-runs, which may miss expired shards, only add clips.
      - name: Save the narration cache
        env:
          ALL_RECORDED: ${{ needs.record.result == 'success' && github.run_attempt == 1 && github.ref == 'refs/heads/master' }}
        run: |
          # Fails rather than saving this run's clips over a cache it couldn't read, unless there is none
          if ! error=$(oras pull "$NARRATION_CACHE" -o saved 2>&1); then
            grep -qi "not found" <<< "$error" || { echo "$error"; exit 1; }
          fi
          mkdir -p saved/.narration-cache .narration-cache
          if [ "$ALL_RECORDED" != true ]; then cp -rn saved/.narration-cache/. .narration-cache/; fi
          if diff -rq saved/.narration-cache .narration-cache; then
            echo "Narration cache unchanged"
          else
            oras push "$NARRATION_CACHE" .narration-cache
          fi

  merge-videos:
    needs: record
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: video-*
          path: videos

      - name: Merge the videos
        env:
          # The number of shards in record's matrix
          SHARDS: 6
        run: |
          # A re-run shard finds the other shards' artifacts expired after a day, and a partial set must not be deployed
          [ "$(ls videos | wc -l)" -eq "$SHARDS" ] || { echo "Expected the videos of $SHARDS shards"; exit 1; }
          mkdir -p manual
          for video in videos/*; do cp -r "$video"/. manual/; done
          for lang in manual/*; do
            jq -s 'add | sort_by(.slug)' videos/*/"${lang##*/}"/index.json > "$lang/index.json"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: manual-videos
          path: manual
          if-no-files-found: error
          retention-days: 1

  # Staging and the releases build with the newest videos
  publish-videos:
    needs: merge-videos
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: registry.version.helsinki.fi
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

      - uses: actions/download-artifact@v8
        with:
          name: manual-videos
          path: manual

      - name: Push the videos
        run: oras push "$MANUAL_VIDEOS:latest" manual --annotation "org.opencontainers.image.revision=$GITHUB_SHA"
