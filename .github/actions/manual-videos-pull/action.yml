name: Manual videos pull
description: The newest manual videos recorded on master from this commit or an earlier one into public/manual, see e2e/manual/README.md

inputs:
  registry-password:
    required: true

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

    - name: Log in to the registry
      uses: docker/login-action@v4.7.0
      with:
        registry: registry.version.helsinki.fi
        username: kontit
        password: ${{ inputs.registry-password }}

    # Never of a newer commit, which could show UI that isn't in this one
    - name: Pull the videos
      shell: bash
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then git fetch --quiet --unshallow; fi
        # None before the first push, its error stays in the log
        tags=$(oras repo tags "$MANUAL_VIDEOS") || tags=
        sha=$(grep -m 1 -Fxf <(echo "$tags") <(git rev-list --first-parent HEAD)) || {
          echo "::warning::No manual videos recorded from this commit or the ones before it"
          exit 0
        }
        oras pull "$MANUAL_VIDEOS:$sha" -o public
        echo "Manual videos recorded from $sha, $(git rev-list --count "$sha..HEAD") commits before this one" >> "$GITHUB_STEP_SUMMARY"
      env:
        MANUAL_VIDEOS: registry.version.helsinki.fi/toska/openshift/kontit/norppa-manual-videos

    - name: Log out of the registry
      shell: bash
      run: docker logout registry.version.helsinki.fi
