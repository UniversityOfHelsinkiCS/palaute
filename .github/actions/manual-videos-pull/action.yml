name: Manual videos pull
description: The newest manual videos recorded on master into public/manual, see e2e/manual/README.md

inputs:
  registry-password:
    required: true

runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

    - name: Log in to the registry
      uses: docker/login-action@v4
      with:
        registry: registry.version.helsinki.fi
        username: kontit
        password: ${{ inputs.registry-password }}

    - name: Pull the videos
      shell: bash
      run: |
        # None before the first push, its error stays in the log
        oras pull "$MANUAL_VIDEOS:latest" -o public || {
          echo "::warning::No manual videos recorded yet"
          exit 0
        }
        sha=$(oras manifest fetch "$MANUAL_VIDEOS:latest" | jq -r '.annotations["org.opencontainers.image.revision"]')
        echo "Manual videos recorded from $sha" >> "$GITHUB_STEP_SUMMARY"
      env:
        MANUAL_VIDEOS: registry.version.helsinki.fi/toska/openshift/kontit/norppa-manual-videos

    - name: Log out of the registry
      shell: bash
      run: docker logout registry.version.helsinki.fi
