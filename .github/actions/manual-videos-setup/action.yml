name: Manual videos setup
description: Node, Playwright, ffmpeg, ORAS, the narration cache and the app for e2e/manual

inputs:
  registry-password:
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: npm

    - name: npm ci
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Install Playwright browser and ffmpeg
      shell: bash
      run: |
        npx playwright install --with-deps chromium
        sudo apt-get install -y --no-install-recommends ffmpeg

    - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2

    - name: Log in to the registry
      uses: docker/login-action@v4
      with:
        registry: registry.version.helsinki.fi
        username: kontit
        password: ${{ inputs.registry-password }}

    - name: Pull the narration cache
      shell: bash
      working-directory: e2e/manual
      run: |
        oras pull "$NARRATION_CACHE" || echo "No narration cache yet"
        mkdir -p .narration-cache

    - name: Start the application
      uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
      env:
        VERSION: ${{ github.ref_name }}
      with:
        timeout_minutes: 5
        max_attempts: 3
        command: docker compose -f docker-compose.ci.yml -f docker-compose.manual.yml up -d

    - name: Wait for the application
      shell: bash
      run: timeout 180 bash -c 'until curl -sf http://localhost:8000/api/ping && curl -sf http://localhost:3003/ping; do sleep 2; done'
